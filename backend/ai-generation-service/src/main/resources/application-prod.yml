careerflow:
  jwt:
    secret: ${JWT_SECRET}
  internal-api-key: ${CAREERFLOW_INTERNAL_API_KEY}
  credentials:
    encryption-key: ${CAREERFLOW_AI_ENCRYPTION_KEY}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoint:
    health:
      show-details: when_authorized
