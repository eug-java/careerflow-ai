apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: careerflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: careerflow/auth-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8079
          envFrom:
            - configMapRef:
                name: careerflow-config
            - secretRef:
                name: careerflow-secrets
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://auth-postgres:5432/careerflow_auth
            - name: SPRING_DATASOURCE_USERNAME
              value: careerflow
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8079
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8079
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: careerflow
spec:
  selector:
    app: auth-service
  ports:
    - port: 8079
      targetPort: 8079
