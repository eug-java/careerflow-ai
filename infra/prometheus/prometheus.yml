global:
  scrape_interval: 5s

scrape_configs:

  - job_name: api-gateway-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['api-gateway-service:8080']

  - job_name: profile-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['profile-service:8081']

  - job_name: job-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['job-service:8082']

  - job_name: matching-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['matching-service:8083']

  - job_name: auth-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['auth-service:8079']

  - job_name: email-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['email-service:8087']

  - job_name: workflow-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['workflow-service:8086']

  - job_name: ai-generation-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['ai-generation-service:8084']

  - job_name: document-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['document-service:8085']
