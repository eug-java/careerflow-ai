name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build and test backend
        run: mvn -B -ntp -f backend/pom.xml clean verify

      - name: Upload JaCoCo coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-reports
          path: backend/**/target/site/jacoco/
          if-no-files-found: ignore

  frontend:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/web-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend/web-app

      - name: Lint
        run: npm run lint
        working-directory: frontend/web-app

      - name: Unit tests
        run: npm run test
        working-directory: frontend/web-app

      - name: Build
        run: npm run build
        working-directory: frontend/web-app

  frontend-e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/web-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend/web-app

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend/web-app

      - name: Run Playwright UI tests
        run: npm run test:e2e -- --grep-invert @fullstack
        working-directory: frontend/web-app

  frontend-e2e-fullstack:
    name: Frontend E2E (Auth + Gateway)
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-jwt-secret-for-e2e-tests-only-xx
      CAREERFLOW_INTERNAL_API_KEY: ci-internal-key-for-e2e
      CAREERFLOW_EMAIL_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
      CAREERFLOW_AI_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Start auth stack
        run: |
          docker compose -f compose.e2e.yaml up -d --build
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/actuator/health >/dev/null; then
              echo "API gateway is ready"
              exit 0
            fi
            sleep 2
          done
          echo "API gateway did not become healthy in time"
          docker compose -f compose.e2e.yaml logs
          exit 1

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/web-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend/web-app

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend/web-app

      - name: Run full-stack auth E2E
        env:
          VITE_API_BASE_URL: http://localhost:8080
        run: npm run test:e2e -- --grep @fullstack
        working-directory: frontend/web-app

      - name: Stop auth stack
        if: always()
        run: docker compose -f compose.e2e.yaml down -v

  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - profile-service
          - job-service
          - matching-service
          - ai-generation-service
          - document-service
          - workflow-service
          - email-service
          - api-gateway-service
    steps:
      - uses: actions/checkout@v7
      - name: Build ${{ matrix.service }} image
        run: docker build -f backend/${{ matrix.service }}/Dockerfile .

  docker-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose files
        env:
          JWT_SECRET: ci-jwt-secret-for-compose-validation-only-xx
          CAREERFLOW_INTERNAL_API_KEY: ci-internal-key-for-validation
          CAREERFLOW_EMAIL_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
          CAREERFLOW_AI_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
        run: |
          docker compose -f docker-compose.yml config >/dev/null
          docker compose -f compose.yaml config >/dev/null
          docker compose -f compose.e2e.yaml config >/dev/null
          docker compose -f docker-compose.full.yml config >/dev/null

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
